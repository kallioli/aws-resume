version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/node follows the Node major in .nvmrc (24); bump both together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # astro check does not support TypeScript 7 (native compiler) yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
