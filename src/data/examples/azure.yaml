# yaml-language-server: $schema=../resume.schema.json
#
# Example resume for the `azure` brand. The person is fictional.
# Build it with:  BRAND=azure RESUME_DATA=src/data/examples/azure.yaml npm run build
#
# Certification names as published on Microsoft Learn (checked October 2026).
# Microsoft role-based certifications are renewed every 12 months (free online
# assessment), hence the one-year expiry dates. The badge images are the generic
# Microsoft Learn level badges, copied under public/brands/azure/ so the page
# loads nothing from learn.microsoft.com (its images set cookies).

basics:
  name: Mira Okonkwo
  title: Azure Platform Architect
  location: Amsterdam, Netherlands
  availability: Open to platform architecture roles
  email: mira.okonkwo@example.com
  website: https://example.com
  profiles:
    - network: github
      label: octocat
      url: https://github.com/octocat
    - network: linkedin
      label: in/mira-okonkwo-example
      url: https://www.linkedin.com/in/mira-okonkwo-example
  summary: |
    Platform architect with ten years of experience building Azure landing zones
    and internal developer platforms for insurance, energy and public sector
    customers. I turn subscription sprawl into governed, self-service platforms
    with policy as code, clear cost ownership and paved paths for product teams.

    Hands-on with Bicep and Terraform, AKS, Azure Container Apps and Azure DevOps /
    GitHub Actions, and at ease explaining identity and network designs to
    security and audit teams.

experiences:
  - company: Polder Cloud Partners
    companyUrl: https://example.com/polder
    role: Azure Platform Architect
    type: Full-time
    location: Amsterdam, Netherlands
    start: "2023-01"
    summary: Lead architect for the Azure practice (30 engineers, 20 customer platforms).
    highlights:
      - Designed an Azure landing zone accelerator (management groups, Azure Policy, Microsoft Entra ID PIM) adopted by 14 customers.
      - Moved 600 VMs from on-premises to Azure with Azure Migrate, cutting hosting costs by 28% after rightsizing and reservations.
      - Built a platform team offering AKS and Container Apps templates; lead time for a new service dropped from four weeks to two days.
    tags: [Azure Policy, Bicep, Terraform, AKS, Microsoft Entra ID, FinOps]

  - company: Northsea Energy
    role: Senior Cloud Engineer
    type: Full-time
    location: Rotterdam, Netherlands
    start: "2019-05"
    end: "2022-12"
    highlights:
      - Introduced hub-and-spoke networking with Azure Firewall and Private Link for 120 workloads.
      - Automated release pipelines in Azure DevOps for 25 teams, with policy gates for security scanning.
      - Set up Azure Monitor and Log Analytics dashboards that halved the time to detect incidents.
    tags: [Azure DevOps, Azure Firewall, Private Link, Azure Monitor, PowerShell]

  - company: Delta Mutual Insurance
    role: Systems Engineer
    type: Full-time
    location: Utrecht, Netherlands
    start: "2015-09"
    end: "2019-04"
    highlights:
      - Ran Windows Server and SQL Server estates and moved the first workloads to Azure IaaS.
    tags: [Windows Server, SQL Server, Hyper-V]

