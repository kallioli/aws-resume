# yaml-language-server: $schema=./resume.schema.json
#
# ─────────────────────────────────────────────────────────────────────────────
#  Your resume. This is the only file you need to edit.
#
#  - Every section except `basics` is optional: delete it and it disappears.
#  - Dates are "YYYY", "YYYY-MM" or "YYYY-MM-DD" (keep the quotes).
#  - Images (photo, badges) are an absolute URL or a file in `public/`.
#  - The build checks this file and lists any mistake with its exact location
#    (e.g. "experiences.0.start: Expected a date ...").
#  - Full reference: README.md, section "Data file reference".
#
#  The person below is fictional. Replace everything with your own data.
# ─────────────────────────────────────────────────────────────────────────────

basics:
  name: Alex Rivera
  title: Principal Cloud Architect
  location: Lausanne, Switzerland
  availability: Open to architecture and platform engineering roles
  photo: avatar.svg # file in public/ or https://... ; remove to show initials
  photoAlt: Illustrated avatar of Alex Rivera
  email: alex.rivera@example.com
  phone: "+41 21 555 01 23"
  website: https://example.com
  profiles:
    - network: github
      label: octocat
      url: https://github.com/octocat
    - network: linkedin
      label: in/alex-rivera-example
      url: https://www.linkedin.com/in/alex-rivera-example
    - network: credly
      label: Credly badges
      url: https://www.credly.com/org/amazon-web-services
  summary: |
    Cloud architect with 12 years of experience designing, migrating and running
    production workloads on AWS for finance, logistics and retail. I help teams
    move from hand-built infrastructure to secure, observable, self-service
    platforms, with a strong focus on multi-account governance, cost and
    reliability.

    Hands-on with infrastructure as code (Terraform, CDK), containers (EKS, ECS)
    and event-driven serverless designs. Comfortable presenting trade-offs to
    executives and pairing with engineers on the details.

experiences:
  - company: Northpeak Digital
    companyUrl: https://example.com/northpeak
    role: Principal Cloud Architect
    type: Full-time
    location: Lausanne, Switzerland
    start: "2022-04"
    summary: Lead architect of the AWS practice (40 engineers, 25 customer platforms).
    highlights:
      - Designed a multi-account landing zone (AWS Organizations, Control Tower, IAM Identity Center) now reused by 18 customers.
      - Cut a retail customer's monthly AWS bill by 34% through Graviton migration, Savings Plans and storage tiering.
      - Introduced a platform team model with golden-path templates; new services go to production in two days instead of three weeks.
    tags: [AWS Organizations, Control Tower, Terraform, EKS, FinOps, Well-Architected]

  - company: Orbital Freight
    role: Senior DevOps Engineer
    type: Full-time
    location: Geneva, Switzerland
    start: "2018-09"
    end: "2022-03"
    highlights:
      - Migrated 120 on-premises VMs and an Oracle estate to AWS (EC2, RDS, Aurora PostgreSQL) with zero unplanned downtime.
      - Built the CI/CD platform (GitHub Actions, CodeDeploy, Argo CD) used by 15 product teams.
      - Implemented centralised logging and tracing (CloudWatch, OpenTelemetry), reducing mean time to recovery from 3 h to 25 min.
    tags: [EC2, Aurora, ECS, Argo CD, GitHub Actions, OpenTelemetry]

  - company: Cobalt Private Bank
    role: Systems Engineer, Cloud Enablement
    type: Full-time
    location: Zurich, Switzerland
    start: "2014-02"
    end: "2018-08"
    highlights:
      - Ran the bank's first regulated workloads on AWS, working with compliance on encryption and data residency controls (KMS, CloudHSM, Config rules).
      - Automated server builds with Ansible and Packer, replacing a 40-page manual runbook.
    tags: [KMS, AWS Config, Ansible, Packer, Linux]

  - company: Lakeside Web Studio
    role: Web Developer
    type: Full-time
    location: Lausanne, Switzerland
    start: "2012-07"
    end: "2014-01"
    highlights:
      - Built and hosted e-commerce sites for local businesses; first production deployments on Amazon EC2 and S3.
    tags: [PHP, MySQL, S3]

